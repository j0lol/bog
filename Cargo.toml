[package]
name = "bog"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.42", features = ["serde"] }
maud = { version = "0.27.0", features = ["poem"] }
poem = { version = "3.1.12", features = ["static-files", "chrono"] }
postgresql = "0.1.1"
rand = "0.9.2"
rusqlite = { version = "0.37.0", features = ["chrono"] }
rusqlite_migration = "2.3.0"
serde = "1.0.228"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread"] }
